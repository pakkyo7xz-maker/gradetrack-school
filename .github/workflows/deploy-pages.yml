# สร้าง GradeTrack เป็นหน้าเว็บไฟล์เดียว แล้วเผยแพร่บน GitHub Pages
# ต้องเปิดใช้ก่อน: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy web app

on:
  push:
    branches: [claude/blissful-pascal-yvtjyn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web -- site/index.html --standalone
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
